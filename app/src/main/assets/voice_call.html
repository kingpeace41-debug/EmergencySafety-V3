<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body { margin:0; width:100%; height:100%; background:#11110e; }
#remote { width:100%; height:100%; object-fit:contain; }
#preview { position:absolute; right:12px; bottom:12px; width:28%; height:28%; object-fit:cover;
  border:1px solid #e8b837; border-radius:12px; transform:scaleX(-1); background:#201f1a; }
</style></head><body><video id="remote" autoplay playsinline></video>
<video id="preview" muted autoplay playsinline hidden></video><script>
let pc, local, stopped = false;
async function start(servers, offer, video) {
  try {
    pc = new RTCPeerConnection({iceServers: servers});
    const received = new MediaStream();
    document.getElementById('remote').srcObject = received;
    pc.ontrack = e => { received.addTrack(e.track); };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') CallBridge.state('connected');
      if (pc.connectionState === 'failed') CallBridge.state('failed');
    };
    local = await navigator.mediaDevices.getUserMedia({audio:true, video:video ? {facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}} : false});
    if (stopped) { local.getTracks().forEach(t => t.stop()); return; }
    if (video) {
      const preview = document.getElementById('preview');
      preview.hidden = false;
      preview.srcObject = local;
    }
    local.getTracks().forEach(t => pc.addTrack(t, local));
    if (offer) await pc.setRemoteDescription({type:'offer', sdp:offer});
    await pc.setLocalDescription(offer ? await pc.createAnswer() : await pc.createOffer());
    if (pc.iceGatheringState !== 'complete') await new Promise(resolve => {
      const timer = setTimeout(resolve, 7500);
      pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') {clearTimeout(timer); resolve();} };
    });
    if (!stopped) CallBridge.description(pc.localDescription.type, pc.localDescription.sdp);
  } catch(e) { if (!stopped) CallBridge.state('failed'); }
}
async function answer(sdp) {
  try { await pc.setRemoteDescription({type:'answer',sdp}); } catch(e) { CallBridge.state('failed'); }
}
function stop() { stopped = true; if(local) local.getTracks().forEach(t=>t.stop()); if(pc) pc.close(); }
</script></body></html>

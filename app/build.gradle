
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.emergencysafety'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.emergencysafety"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        esSigning {
            def signingPath = System.getenv('ES_KEYSTORE_PATH')
            def signingPassword = System.getenv('ES_KEYSTORE_PASSWORD')
            def signingAlias = System.getenv('ES_KEY_ALIAS')

            if (signingPath && signingPassword && signingAlias) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ES_KEYSTORE_PATH')) {
                signingConfig signingConfigs.esSigning
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Vosk çevrimdışı konuşma tanıma
    implementation 'com.alphacephei:vosk-android:0.3.75'

    // Google Fused Location Provider
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Trixnity sürümlerini birlikte yöneten BOM
    implementation platform('de.connect2x.trixnity:trixnity-bom:5.10.1')

    // Matrix SDK
    implementation 'de.connect2x.trixnity:trixnity-client'

    // Matrix uçtan uca şifreleme - Vodozemac
    implementation 'de.connect2x.trixnity:trixnity-client-cryptodriver-vodozemac'

    // Ktor CIO ağ motoru
    implementation 'io.ktor:ktor-client-cio:3.5.2'

    // Ktor WebSocket desteği
    implementation 'io.ktor:ktor-client-websockets:3.5.2'
}

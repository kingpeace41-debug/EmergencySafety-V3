plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.emergencysafety'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.emergencysafety"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Vosk çevrimdışı konuşma tanıma
    implementation 'com.alphacephei:vosk-android:0.3.75'

    // Google Fused Location Provider
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Trixnity sürümlerini birlikte yöneten BOM
    implementation platform('de.connect2x.trixnity:trixnity-bom:5.10.1')

    // Matrix SDK
    implementation 'de.connect2x.trixnity:trixnity-client'

    // Matrix uçtan uca şifreleme - Vodozemac
    implementation 'de.connect2x.trixnity:trixnity-client-cryptodriver-vodozemac'

    // Ktor CIO ağ motoru - Trixnity ile aynı sürüm çizgisi
    implementation 'io.ktor:ktor-client-cio:3.5.2'
}

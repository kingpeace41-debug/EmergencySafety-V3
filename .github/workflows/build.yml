
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Download Turkish Vosk Model
        run: |
          set -e

          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"
          TEMP_DIR="/tmp/vosk-model-unpack"
          ASSET_DIR="app/src/main/assets"
          MODEL_DIR="$ASSET_DIR/model"

          rm -rf "$TEMP_DIR" "$MODEL_DIR"
          mkdir -p "$TEMP_DIR" "$ASSET_DIR"

          curl -fL --retry 3 "$MODEL_URL" \
            -o /tmp/vosk-model.zip

          unzip -q /tmp/vosk-model.zip -d "$TEMP_DIR"

          echo "İndirilen klasörler:"
          find "$TEMP_DIR" -maxdepth 3 -type d

          SOURCE_MODEL="$TEMP_DIR/vosk-model-small-tr-0.3"

          if [ ! -d "$SOURCE_MODEL" ]; then
            echo "HATA: Model klasörü bulunamadı."
            find "$TEMP_DIR" -maxdepth 4 -print
            exit 1
          fi

          mv "$SOURCE_MODEL" "$MODEL_DIR"

          echo "Modelin üst düzey dosya ve klasörleri:"
          find "$MODEL_DIR" -maxdepth 2 -print | head -100

          echo "UUID dosyası kontrol ediliyor..."
          if [ ! -s "$MODEL_DIR/uuid" ]; then
            printf '%s\n' 'vosk-model-small-tr-0.3' > "$MODEL_DIR/uuid"
          fi

          echo "Model klasör yapısı kontrol ediliyor..."

          if [ ! -d "$MODEL_DIR/conf" ] || [ ! -d "$MODEL_DIR/am" ]; then
            echo "HATA: Beklenen conf veya am klasörü bulunamadı."
            echo "Mevcut klasörler:"
            find "$MODEL_DIR" -maxdepth 3 -type d
            exit 1
          fi

          echo "Model kontrolü tamamlandı."

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk \
            -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK oluşturuldu: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySafety-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

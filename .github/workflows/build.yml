name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Download Turkish Vosk Model
        run: |
          set -e

          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"
          TEMP_DIR="/tmp/vosk-model-unpack"
          MODEL_DIR="app/src/main/assets/model"

          rm -rf "$TEMP_DIR" "$MODEL_DIR"
          mkdir -p "$TEMP_DIR" app/src/main/assets

          curl -fL --retry 3 "$MODEL_URL" \
            -o /tmp/vosk-model.zip

          unzip -q /tmp/vosk-model.zip -d "$TEMP_DIR"

          SOURCE_MODEL="$TEMP_DIR/vosk-model-small-tr-0.3"

          if [ ! -d "$SOURCE_MODEL" ]; then
            echo "HATA: Türkçe model klasörü bulunamadı."
            find "$TEMP_DIR" -maxdepth 3 -print
            exit 1
          fi

          mv "$SOURCE_MODEL" "$MODEL_DIR"

          echo "Vosk model dosyaları kontrol ediliyor..."

          test -s "$MODEL_DIR/final.mdl"
          test -s "$MODEL_DIR/HCLr.fst"
          test -s "$MODEL_DIR/Gr.fst"
          test -s "$MODEL_DIR/mfcc.conf"

          printf '%s\n' 'vosk-model-small-tr-0.3' \
            > "$MODEL_DIR/uuid"

          test -s "$MODEL_DIR/uuid"

          echo "Model dosyaları bulundu:"
          ls -lh "$MODEL_DIR"

          echo "Model kontrolü başarılı."

      - name: Prepare stable APK signing
        env:
          ES_KEYSTORE_BASE64: ${{ secrets.ES_KEYSTORE_BASE64 }}
          ES_KEYSTORE_PASSWORD: ${{ secrets.ES_KEYSTORE_PASSWORD }}
          ES_PASSWORD_CHECK_SHA256: ${{ secrets.ES_PASSWORD_CHECK_SHA256 }}
          ES_KEY_ALIAS: ${{ secrets.ES_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$ES_KEYSTORE_BASE64" ] || [ -z "$ES_KEYSTORE_PASSWORD" ] || [ -z "$ES_KEY_ALIAS" ]; then
            echo "HATA: APK imzalama secret bilgileri eksik."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/emergencysafety.jks"
          if ! printf '%s' "$ES_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "::error::Anahtar Base64 verisi çözümlenemedi. ES_KEYSTORE_BASE64 değerini kontrol et."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Çözümlenen anahtar dosyası boş."
            exit 1
          fi

          EXPECTED_SHA256="d6dcff0b4ae78b3be4dffe9e6b9c54f5c97c2b09dfa52a541da42359a46ffb1b"
          ACTUAL_SHA256="$(sha256sum "$KEYSTORE_PATH" | cut -d ' ' -f 1)"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::GitHub'daki JKS dosyası sunucudaki orijinalle eşleşmiyor. ES_KEYSTORE_BASE64 içeriğini yeniden aktarmak gerekiyor."
            exit 1
          fi
          echo "JKS dosya bütünlüğü doğrulandı."

          # Yalnizca eslesme sonucunu goster; parola ve ozeti loglanmaz.
          if [ -z "${ES_PASSWORD_CHECK_SHA256:-}" ]; then
            echo "::error::Parola karsilastirma secret'i eksik."
            exit 1
          fi
          ACTUAL_PASSWORD_SHA256="$(printf '%s' "$ES_KEYSTORE_PASSWORD" | sha256sum | cut -d ' ' -f 1)"
          if [ "$ACTUAL_PASSWORD_SHA256" = "$ES_PASSWORD_CHECK_SHA256" ]; then
            echo "Parola ozeti eslesiyor."
          else
            echo "::error::Parola ozeti eslesmiyor: GitHub'daki parola, Termius'ta test edilen paroladan farkli."
            exit 1
          fi
          unset ACTUAL_PASSWORD_SHA256

          # keytool hata metni stdout'a da yazilabilir; iki akisi yakala.
          KEYTOOL_OUTPUT="$RUNNER_TEMP/keytool-check.log"
          if ! keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ES_KEYSTORE_PASSWORD" > "$KEYTOOL_OUTPUT" 2>&1; then
            echo "::error::Keytool dogrulamasi basarisiz. Gercek hata mesaji:"
            while IFS= read -r line || [ -n "$line" ]; do
              # Secret degerini hicbir durumda loga yazma.
              line="${line//"$ES_KEYSTORE_PASSWORD"/[GIZLI]}"
              line="${line//"$ES_KEYSTORE_BASE64"/[GIZLI]}"
              echo "$line"
            done < "$KEYTOOL_OUTPUT"
            echo "Runner Java surumu:"
            java -version 2>&1 | head -n 3
            exit 1
          fi
          echo "JKS deposu parolasi dogrulandi."

          if ! keytool -list -keystore "$KEYSTORE_PATH" -alias "$ES_KEY_ALIAS" \
            -storepass "$ES_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::JKS deposu acildi ancak ES_KEY_ALIAS eslesmiyor."
            exit 1
          fi
          echo "JKS alias dogrulandi."

          echo "ES_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Kalıcı imzalama anahtarı hazır."

      - name: Build Android APK
        env:
          ES_KEYSTORE_PASSWORD: ${{ secrets.ES_KEYSTORE_PASSWORD }}
          ES_KEY_ALIAS: ${{ secrets.ES_KEY_ALIAS }}
        run: |
          set -o pipefail

          gradle assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee build-debug.log

      - name: Upload Build Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySafety-Build-Debug-Log
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -name '*.apk' -print -quit)

          test -n "$APK"

          echo "APK oluşturuldu: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySafety-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

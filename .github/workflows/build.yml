
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Download Turkish Vosk Model
        run: |
          set -e

          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"
          TEMP_DIR="/tmp/vosk-model-unpack"
          MODEL_DIR="app/src/main/assets/model"

          rm -rf "$TEMP_DIR" "$MODEL_DIR"
          mkdir -p "$TEMP_DIR" app/src/main/assets

          curl -fL --retry 3 "$MODEL_URL" \
            -o /tmp/vosk-model.zip

          unzip -q /tmp/vosk-model.zip -d "$TEMP_DIR"

          SOURCE_MODEL="$TEMP_DIR/vosk-model-small-tr-0.3"

          if [ ! -d "$SOURCE_MODEL" ]; then
            echo "HATA: Türkçe model klasörü bulunamadı."
            find "$TEMP_DIR" -maxdepth 3 -print
            exit 1
          fi

          mv "$SOURCE_MODEL" "$MODEL_DIR"

          echo "Vosk model dosyaları kontrol ediliyor..."

          test -s "$MODEL_DIR/final.mdl"
          test -s "$MODEL_DIR/HCLr.fst"
          test -s "$MODEL_DIR/Gr.fst"
          test -s "$MODEL_DIR/mfcc.conf"

          printf '%s\n' 'vosk-model-small-tr-0.3' \
            > "$MODEL_DIR/uuid"

          test -s "$MODEL_DIR/uuid"

          echo "Model dosyaları bulundu:"
          ls -lh "$MODEL_DIR"

          echo "Model kontrolü başarılı."

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk \
            -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK oluşturuldu: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySafety-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

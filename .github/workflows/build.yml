name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Download Turkish Vosk Model
        run: |
          set -e

          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"

          mkdir -p /tmp/vosk-model-unpack
          mkdir -p app/src/main/assets

          curl -fL --retry 3 "$MODEL_URL" \
            -o /tmp/vosk-model.zip

          unzip -q /tmp/vosk-model.zip \
            -d /tmp/vosk-model-unpack

          MODEL_DIR="/tmp/vosk-model-unpack/vosk-model-small-tr-0.3"

          if [ ! -d "$MODEL_DIR" ]; then
            echo "HATA: Türkçe model klasörü bulunamadı."
            find /tmp/vosk-model-unpack -maxdepth 3 -print
            exit 1
          fi

          rm -rf app/src/main/assets/model
          mv "$MODEL_DIR" app/src/main/assets/model

          # Vosk StorageService bu dosyayı arıyor.
          printf '%s\n' 'vosk-model-small-tr-0.3' \
            > app/src/main/assets/model/uuid

          echo "Model dosyaları kontrol ediliyor:"
          test -s app/src/main/assets/model/uuid
          test -d app/src/main/assets/model/conf
          test -d app/src/main/assets/model/am

          echo "UUID dosyası:"
          cat app/src/main/assets/model/uuid

          echo "Model klasörü hazır."

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk \
            -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK başarıyla oluşturuldu: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmergencySafety-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
